name: Reusable PR Validation

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_registry:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      shared_role_arn:
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: nonprod-arc-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.shared_role_arn }}
          role-session-name: ${{ inputs.service }}-pr-validation

      - name: Build image
        run: |
          IMAGE_URI="${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${{ inputs.service }}-${GITHUB_SHA}"

          docker build \
            -f services/${{ inputs.environment }}/${{ inputs.service }}/Dockerfile \
            -t "$IMAGE_URI" \
            services/${{ inputs.environment }}/${{ inputs.service }}

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
