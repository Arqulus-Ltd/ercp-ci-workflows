name: Reusable Build Scan Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      ecr_repository:
        required: false
        type: string
        default: ercp-images
      aws_region:
        required: false
        type: string
        default: eu-north-1
      shared_role_arn:
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-scan-push:
    runs-on: nonprod-arc-runner

    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.shared_role_arn }}
          role-session-name: ${{ inputs.service_name }}-build

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com" >> $GITHUB_ENV

          aws ecr get-login-password --region ${{ inputs.aws_region }} | \
          docker login --username AWS --password-stdin \
          $ACCOUNT_ID.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com

      - name: Build image
        run: |
          IMAGE_TAG="${{ inputs.service_name }}-${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${{ inputs.ecr_repository }}:${IMAGE_TAG}"

          docker build \
            -f ${{ inputs.dockerfile }} \
            -t $IMAGE_URI \
            ${{ inputs.context }}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        run: |
          docker push $IMAGE_URI

      - name: Print image
        run: |
          echo "Image pushed:"
          echo "$IMAGE_URI"
