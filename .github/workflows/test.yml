name: test
on:
  workflow_call:
    inputs:
      runner-label:
        required: false
        type: string
        default: ubuntu-latest
      go-version:
        required: false
        type: string
        default: "1.26.4"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner-label }}
    steps:
      - name: Checkout (per-job GITHUB_TOKEN only)
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: build / vet / test
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...
