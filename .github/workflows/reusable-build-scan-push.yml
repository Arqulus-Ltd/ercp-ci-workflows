name: Reusable Build Scan Push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_registry:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
    secrets:
      shared_role_arn:
        required: true
    outputs:
      digest:
        value: ${{ jobs.build-scan-push.outputs.digest }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-scan-push:
    runs-on: nonprod-arc-runner
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.shared_role_arn }}
          role-session-name: ${{ inputs.service }}-build

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ inputs.aws_region }} | \
          docker login --username AWS --password-stdin ${{ inputs.ecr_registry }}

      - name: Build image
        run: |
          IMAGE_TAG="${{ inputs.service }}-${GITHUB_SHA}"
          IMAGE_URI="${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${IMAGE_TAG}"

          docker build \
            -f services/${{ inputs.service }}/Dockerfile \
            -t "$IMAGE_URI" \
            .

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ inputs.ecr_repository }} \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ${{ inputs.aws_region }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: $DIGEST"