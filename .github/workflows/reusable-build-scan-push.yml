name: Reusable Build Scan Push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_registry:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      shared_role_arn:
        required: true
        type: string
      gitops_branch:
        required: false
        type: string
        default: develop-19-06-2026

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  build-scan-push:
    runs-on: nonprod-arc-runner

    steps:
      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitops_branch }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.shared_role_arn }}
          role-session-name: ${{ inputs.service }}-build

      - name: Build & Push Image
        shell: bash
        run: |
          IMAGE_TAG="${{ inputs.service }}-${GITHUB_SHA}"
          IMAGE_URI="${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${IMAGE_TAG}"

          export DOCKER_CONFIG="${GITHUB_WORKSPACE}/.docker"
          mkdir -p "$DOCKER_CONFIG"

          cat > "$DOCKER_CONFIG/config.json" <<EOF
          {
            "credHelpers": {
              "${{ inputs.ecr_registry }}": "ecr-login"
            }
          }
          EOF

          /kaniko/executor \
            --context "${GITHUB_WORKSPACE}/services/${{ inputs.environment }}/${{ inputs.service }}" \
            --dockerfile "${GITHUB_WORKSPACE}/services/${{ inputs.environment }}/${{ inputs.service }}/Dockerfile" \
            --destination "${IMAGE_URI}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Update values.yaml
        shell: bash
        run: |
          VALUES_FILE="services/${{ inputs.environment }}/${{ inputs.service }}/values.yaml"

          sed -i "s|tag: .*|tag: $IMAGE_TAG|" "$VALUES_FILE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "$VALUES_FILE"
          git commit -m "Update ${{ inputs.service }} ${{ inputs.environment }} image to $IMAGE_TAG" || echo "No changes"

          git push
