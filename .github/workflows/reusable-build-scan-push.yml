name: Reusable Build Scan Push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_registry:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      gitops_repo:
        required: true
        type: string
      gitops_branch:
        required: true
        type: string
    secrets:
      shared_role_arn:
        required: true
      gitops_app_id:
        required: true
      gitops_app_private_key:
        required: true
    outputs:
      digest:
        value: ${{ jobs.build-scan-push.outputs.digest }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.shared_role_arn }}
          role-session-name: ${{ inputs.service }}-build

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ inputs.aws_region }} | \
          docker login --username AWS --password-stdin ${{ inputs.ecr_registry }}

      - name: Build image
        run: |
          IMAGE_TAG="${{ inputs.service }}-${GITHUB_SHA}"
          IMAGE_URI="${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}:${IMAGE_TAG}"

          docker build \
            -f services/${{ inputs.service }}/Dockerfile \
            -t "$IMAGE_URI" \
            .

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        run: docker push "$IMAGE_URI"

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ inputs.ecr_repository }} \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ${{ inputs.aws_region }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: $DIGEST"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.gitops_app_id }}
          private-key: ${{ secrets.gitops_app_private_key }}
          owner: Arqulus-Ltd
          repositories: ercp-gitops

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          ref: ${{ inputs.gitops_branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: ercp-gitops

      - name: Update GitOps values
        run: |
          VALUES_FILE="ercp-gitops/services/${{ inputs.environment }}/${{ inputs.service }}/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: $VALUES_FILE not found"
            exit 1
          fi

          sed -i "s|repository: .*|repository: ${{ inputs.ecr_registry }}/${{ inputs.ecr_repository }}|" "$VALUES_FILE"
          sed -i "s|digest: .*|digest: \"${{ steps.digest.outputs.digest }}\"|" "$VALUES_FILE"

          echo "Updated $VALUES_FILE"
          cat "$VALUES_FILE"

      - name: Create GitOps PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ercp-gitops
          branch: update-${{ inputs.environment }}-${{ inputs.service }}-${{ github.sha }}
          base: ${{ inputs.gitops_branch }}
          title: "Update ${{ inputs.environment }}/${{ inputs.service }} image digest"
          commit-message: "Update ${{ inputs.environment }}/${{ inputs.service }} image digest"
          body: |
            Updated image digest for `${{ inputs.environment }}/${{ inputs.service }}`.

            Digest:
            `${{ steps.digest.outputs.digest }}`