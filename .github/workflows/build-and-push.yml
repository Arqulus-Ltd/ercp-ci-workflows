name: build-and-push
on:
  workflow_call:
    inputs:
      service:
        description: Service name (image name component).
        required: true
        type: string
      dockerfile:
        description: Dockerfile location.
        required: true
        type: string
      image-repo:
        description: ECR repository URI (account.dkr.ecr.region.amazonaws.com/ercp/<svc>).
        required: true
        type: string
      runner-label:
        description: Runner label (ARC self-hosted label, or ubuntu-latest). Kept an input so the same template runs on ARC later.
        required: false
        type: string
        default: ubuntu-latest
      aws-region:
        required: false
        type: string
        default: eu-west-1
    secrets:
      deploy-role-arn:
        description: ARN of the OIDC-assumable deploy role (no static keys).
        required: true
    outputs:
      digest:
        description: The pushed image digest (sha256:...).
        value: ${{ jobs.build.outputs.digest }}

# Source-read is the per-job GITHUB_TOKEN only; id-token for OIDC. No static token; read-only on repo files.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner-label }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout (per-job GITHUB_TOKEN only)
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.deploy-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push by digest
        id: push
        run: |
          set -euo pipefail
          image="${{ inputs.image-repo }}"
          ref="$image:ci-${{ github.sha }}"
          docker build -f "${{ inputs.dockerfile }}" -t "$ref" .
          docker push "$ref"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $image@$digest"
